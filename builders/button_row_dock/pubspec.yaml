name: button_row_dock_builder
description: Button dock that arranges two buttons horizontally at the bottom of the screen.

version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: theme
  typography:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/typography
  distance:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/distance
  corner_radius:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/corner_radius

dev_dependencies:
  flutter_test:
    sdk: flutter
