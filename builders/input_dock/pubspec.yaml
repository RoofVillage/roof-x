name: input_dock_builder
description: Input dock functionality for artboards.

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  decorated_text:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: lib/decorated_text
  haptics:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: lib/haptics
  standard_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: icons/standard
  image_picker_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: builders/image_picker
  padding:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/padding
  corner_radius:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/corner_radius
  distance:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/distance
  duration:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/duration
  curve:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/curve
  theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: theme
  typography:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/typography
  button_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: builders/button

dev_dependencies:
  flutter_test:
    sdk: flutter
