name: form_builder
description: A form with information and buttons.

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  button_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: builders/button
  form_body_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: builders/form_body
  distance:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/distance
  typography:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/typography
  button_status_option:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: options/button_status

dev_dependencies:
  flutter_test:
    sdk: flutter
