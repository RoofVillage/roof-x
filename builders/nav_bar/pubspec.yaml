name: nav_bar_builder
description: Nav bar functionality for artboards.

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  haptics:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: lib/haptics
  standard_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: icons/standard
  nav_button_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: builders/nav_button
  semantic_theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: semantic_theme
  inherited_scroll_controller_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: builders/inherited_scroll_controller

dependency_overrides:
  semantic_theme:
    path: ../../semantic_theme
  nav_button_builder:
    path: ../nav_button
  inherited_scroll_controller_builder:
    path: ../inherited_scroll_controller

dev_dependencies:
  flutter_test:
    sdk: flutter
