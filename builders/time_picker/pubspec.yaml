name: time_picker_builder
description: Component for selecting a time of day

version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  artboard:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: lib/artboard
  theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: theme
  duration:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/duration
  curve:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/curve
  haptics:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: lib/haptics
  labeled_value:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: labeled_value
  roller_column_picker_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: builders/roller_column_picker
  typography:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/typography

dev_dependencies:
  flutter_test:
    sdk: flutter
