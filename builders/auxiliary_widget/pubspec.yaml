name: auxiliary_widget_builder
description: Icon button with specific icon and onTap function.

version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  multi_image_picker: ^3.0.23
  flutter:
    sdk: flutter
  standard_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: icons/standard
  typography:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/typography
  theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: theme
  haptics:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: lib/haptics
  distance:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/distance
  corner_radius:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: spec/corner_radius
  typedefs:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: lib/typedefs
  button_status_option:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: options/button_status
  image_picker_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: builders/image_picker
  input_dock_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: packages
      path: builders/input_dock

dev_dependencies:
  flutter_test:
    sdk: flutter
