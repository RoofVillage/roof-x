name: interval_frequency_picker_builder
description: Component for selecting a schedule interval and frequency

version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  artboard:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: lib/artboard
  theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: theme
  duration:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
