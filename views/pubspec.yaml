name: views
description: Framework for loading dynamic data for different views.

version: 1.0.0+1

environment:
  sdk: ">=2.1.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.12.0+3
  device_info: ^0.4.0+1
  network:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: lib/network
  synchronizer:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: synchronizer
  session:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: session
  public:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: model/objects/public
  mappable:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: model/mixins/mappable

dev_dependencies:
  flutter_test:
    sdk: flutter
