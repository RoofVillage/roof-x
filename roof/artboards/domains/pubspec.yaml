name: domains_artboard
description: Allows the user to see their domains and enter one.
version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  app_data:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: app_data
  navigator:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: lib/navigator
  commands:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: roof/commands
  stream_list_view_vertical_full_screen_artboard_template:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: artboard_templates/vertical_full_screen/stream_list_view
  views:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: roof/views
  view_stream_builder_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: builders/view_stream_builder
  spaced_list_view_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: builders/spaced_list_view
  semantic_theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: semantic_theme
  navigation_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: icons/navigation
  standard_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: icons/standard
  table_cell_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: builders/table_cell

dependency_overrides:
  table_cell_builder:
    path: ../../../builders/table_cell
  spaced_list_view_builder:
    path: ../../../builders/spaced_list_view
  view_stream_builder_builder:
    path: ../../../builders/view_stream_builder
  commands:
    path: ../../commands
  views:
    path: ../../views
  stream_list_view_vertical_full_screen_artboard_template:
    path: ../../../artboard_templates/vertical_full_screen/stream_list_view

dev_dependencies:
  flutter_test:
    sdk: flutter
