name: roof_table_cell_builder
description: Library of builders for Roof table cells.

version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  semantic_theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: semantic_theme
  haptics:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: lib/haptics
  table_cell_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: builders/table_cell
  tag_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: builders/tag
  date:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: lib/date
  mask:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: lib/mask
  views:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: roof/views

dependency_overrides:
  table_cell_builder:
    path: ../../../builders/table_cell
  haptics:
    path: ../../../lib/haptics
  date:
    path: ../../../lib/date
  mask:
    path: ../../../lib/mask
  semantic_theme:
    path: ../../../semantic_theme
  views:
    path: ../../views

dev_dependencies:
  flutter_test:
    sdk: flutter
