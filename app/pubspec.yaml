name: app
description: Delightful renting for roommates and landlords.

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  spec:
    path: ./../spec
  table:
    path: ./../table
  roof_form:
    path: ./../roof_form
  services:
    path: ./../services
  icon_library:
    path: ./../icon_library
  decorated_text:
    path: ./../decorated_text
  thread:
    path: ./../thread
  bottom_sheet:
    path: ./../bottom_sheet

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Azo
      fonts:
        - asset: fonts/Azo/AzoSans-Thin.otf
          weight: 100
        - asset: fonts/Azo/AzoSans-Light.otf
          weight: 200
        - asset: fonts/Azo/AzoSans-Regular.otf
          weight: 300
        - asset: fonts/Azo/AzoSans-Medium.otf
          weight: 400
        - asset: fonts/Azo/AzoSans-Bold.otf
          weight: 500
