name: app
description: Delightful renting for roommates and landlords.

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  table:
    path: ../table
  roof_form:
    path: ../roof_form
  services:
    path: ../services
  icon_library:
    path: ../icon_library
  decorated_text:
    path: ../decorated_text
  artboard_templates:
    path: ../artboard_templates
  navigation_components:
    path: ../navigation_components
  theme:
    path: ../theme
  table_components:
    path: ../table_components
  routing:
    path: ../routing
  typography:
    path: ../typography

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: azo
      fonts:
        - asset: packages/typography/fonts/azo/AzoSans-Thin.otf
          weight: 100
        - asset: packages/typography/fonts/azo/AzoSans-Light.otf
          weight: 200
        - asset: packages/typography/fonts/azo/AzoSans-Regular.otf
          weight: 300
        - asset: packages/typography/fonts/azo/AzoSans-Medium.otf
          weight: 400
        - asset: packages/typography/fonts/azo/AzoSans-Bold.otf
          weight: 500
