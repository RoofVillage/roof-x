name: register_artboard
description: Allows the user to create their account.
version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  form_vertical_floating_artboard_template:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: artboard_templates/vertical_floating/form
  form_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: builders/form
  app_data:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: app_data
  navigator:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: lib/navigator
  commands:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: sustainers_market/commands
  auth_verify_code_artboard:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-sm-app
      path: sustainers_market/artboards/auth_verify_code

dependency_overrides:
  auth_verify_code_artboard:
    path: ../auth_verify_code
  commands:
    path: ../../commands
  form_builder:
    path: ../../../builders/form
  navigator:
    path: ../../../lib/navigator

dev_dependencies:
  flutter_test:
    sdk: flutter
