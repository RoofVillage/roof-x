name: services_artboard
description: Allows the user to view their services.
version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  titled_table_vertical_full_screen_artboard_template:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: artboard_templates/vertical_full_screen/titled_table
  form_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: builders/form
  app_data:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: app_data
  navigator:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: lib/navigator
  views:
    path: ../../views
  commands:
    path: ../../commands
  service_dashboard_artboard:
    path: ../service_dashboard
  view_stream_builder:
    path: ../../../components/view_stream_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
