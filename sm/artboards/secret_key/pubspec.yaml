name: secret_key_artboard
description: Allows the user to view a secret key.
version: 1.0.0+1

environment:
  sdk: ">=2.1.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  app_data:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: app_data
  navigator:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: lib/navigator
  commands:
    path: ../../commands
  button:
    path: ../../../components/button
  view_stream_builder:
    path: ../../../components/view_stream_builder
  stack_vertical_floating_artboard_template:
    path: ../../../artboard_templates/vertical_floating/stack

dev_dependencies:
  flutter_test:
    sdk: flutter
