name: welcome_activity_artboard
description: Welcomes user to Sustainers Market app.
version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  empty_table_vertical_full_screen_artboard_template:
    path: ../../../artboard_templates/vertical_full_screen/empty_table
  sign_up_artboard:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: artboards/sign_up
  app_data:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: app_data
  nav_button_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: builders/nav_button
  navigation_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: icons/navigation
  standard_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: icons/standard
  public:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: model/objects/public
  navigator:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: lib/navigator
  button_row_dock_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: builders/button_row_dock
  button_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: builders/button
  commands:
    path: ../../commands
  views:
    path: ../../views
  log_in_artboard:
    path: ../log_in
  create_service_artboard:
    path: ../create_service

dependency_overrides:
  nav_button_builder:
    path: ../../../builders/nav_button
  button_row_dock_builder:
    path: ../../../builders/button_row_dock
  button_builder:
    path: ../../../builders/button

dev_dependencies:
  flutter_test:
    sdk: flutter
