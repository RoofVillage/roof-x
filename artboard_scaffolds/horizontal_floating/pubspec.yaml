name: horizontal_floating_artboard_scaffold
description: Tools to for scaffolding and navigating to a horizontal floating artboard.

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  keyboard_accessory:
    path: ../../lib/keyboard_accessory
  artboard:
    path: ../../lib/artboard
  curve:
    path: ../../spec/curve
  distance:
    path: ../../spec/distance
  duration:
    path: ../../spec/duration
  corner_radius:
    path: ../../spec/corner_radius
  theme:
    path: ../../theme
  navigator:
    path: ../../lib/navigator

dev_dependencies:
  flutter_test:
    sdk: flutter
