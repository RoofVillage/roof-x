name: horizontal_floating_artboard_scaffold
description: Tools to for scaffolding and navigating to a horizontal floating artboard.

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  keyboard_accessory:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: lib/keyboard_accessory
  artboard:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: lib/artboard
  curve:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: spec/curve
  distance:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: spec/distance
  duration:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: spec/duration
  corner_radius:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: spec/corner_radius
  theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: theme
  navigator:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: lib/navigator

dev_dependencies:
  flutter_test:
    sdk: flutter
