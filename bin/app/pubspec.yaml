name: app
description: Delightful renting for roommates and landlords.

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  roof_theme:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: roof_theme
  public_activity_artboard:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: artboards/public_activity
  vertical_full_screen_artboard_scaffold:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: artboard_scaffolds/vertical_full_screen
  artboard:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: lib/artboard
  device_screen:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: lib/device_screen
  commands:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: semantic-theme-compatible-builders
      path: commands

dependency_overrides:
  artboard:
    path: ../../lib/artboard
  public_activity_artboard:
    path: ../../artboards/public_activity
  vertical_full_screen_artboard_scaffold:
    path: ../../artboard_scaffolds/vertical_full_screen
  vertical_floating_artboard_scaffold:
    path: ../../artboard_scaffolds/vertical_floating
  horizontal_floating_artboard_scaffold:
    path: ../../artboard_scaffolds/horizontal_floating
  roof_theme:
    path: ../../roof_theme
      
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: RoofXSmallIcons
      fonts:
        - asset: packages/x_small_icon_library/ttf/RoofXSmallIcons.ttf
    - family: RoofSmallIcons
      fonts:
        - asset: packages/small_icon_library/ttf/RoofSmallIcons.ttf
    - family: RoofStandardIcons
      fonts:
        - asset: packages/standard_icon_library/ttf/RoofStandardIcons.ttf
    - family: RoofNavigationIcons
      fonts:
        - asset: packages/navigation_icon_library/ttf/RoofNavigationIcons.ttf
    - family: azo
      fonts:
        - asset: packages/roof_theme/fonts/azo/AzoSans-Thin.otf
          weight: 100
        - asset: packages/roof_theme/fonts/azo/AzoSans-Light.otf
          weight: 200
        - asset: packages/roof_theme/fonts/azo/AzoSans-Regular.otf
          weight: 300
        - asset: packages/roof_theme/fonts/azo/AzoSans-Medium.otf
          weight: 400
        - asset: packages/roof_theme/fonts/azo/AzoSans-Bold.otf
          weight: 500
