name: invoice_sandbox
description: 

version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  theme:
    path: ../../theme
  vertical_full_screen_artboard_scaffold:
    path: ../../artboard_scaffolds/vertical_full_screen
  navigable_object_table_artboard_template:
    path: ../../artboard_templates//vertical_full_screen/navigable_object_table
  artboard:
    path: ../../lib/artboard
  device_screen:
    path: ../../lib/device_screen
  nav_bar_builder:
    path: ../../builders/nav_bar
  breadcrumb_stack_builder:
    path: ../../builders/breadcrumb_stack
  table_builder:
    path: ../../builders/table
  tabbed_container_builder:
    path: ../../builders/tabbed_container

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: azo
      fonts:
        - asset: packages/typography/fonts/azo/AzoSans-Thin.otf
          weight: 100
        - asset: packages/typography/fonts/azo/AzoSans-Light.otf
          weight: 200
        - asset: packages/typography/fonts/azo/AzoSans-Regular.otf
          weight: 300
        - asset: packages/typography/fonts/azo/AzoSans-Medium.otf
          weight: 400
        - asset: packages/typography/fonts/azo/AzoSans-Bold.otf
          weight: 500
