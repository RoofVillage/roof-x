name: public_activity_artboard
description: Allows the user to see a public activity feed.
version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  full_logo_table_vertical_full_screen_artboard_template:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: artboard_templates/vertical_full_screen/full_logo_table
  sign_up_artboard:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: artboards/sign_up
  app_data:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: app_data
  nav_button_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: builders/nav_button
  navigation_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: icons/navigation
  standard_icon_library:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: icons/standard
  public:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: model/objects/public
  navigator:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: lib/navigator
  views:
    path: ../../views
  button_row_dock_builder:
    path: ../../builders/button_row_dock
  button_builder:
    git:
      url: git@github.com:RoofVillage/roof-x.git
      ref: master
      path: builders/button
    # button_row_dock_builder:
    #   git:
    #     url: git@github.com:RoofVillage/roof-x.git
    #     ref: master
    #     path: builders/button_row_dock
  commands:
    path: ../../commands

dependency_overrides:
  button_builder:
    path: ../../builders/button
#   button_row_dock_builder:
#     path: ../../builders/button_row_dock

dev_dependencies:
  flutter_test:
    sdk: flutter
