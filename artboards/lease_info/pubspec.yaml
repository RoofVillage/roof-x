name: lease_info_floating_artboard_template
description: A stack artboard for displaying lease info and an edit button.
version: 1.0.0+1

environment:
  sdk: ">=2.0.0-dev.68.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  artboard:
    path: ../../lib/artboard
  stack_vertical_floating_artboard_template:
    path: ../../artboard_templates/vertical_floating/stack
  nav_bar_builder:
    path: ../../builders/nav_bar
  button_builder:
    path: ../../builders/button
  caret_wrap_builder:
    path: ../../builders/caret_wrap
  cells_list_view_builder:
    path: ../../builders/cells_list_view
  tag_builder:
    path: ../../builders/tag
  key_value_row_builder:
    path: ../../builders/key_value_row
  tab:
    path: ../../tab
  navigation_icon_library:
    path: ../../icons/navigation
  x_small_icon_library:
    path: ../../icons/x_small
  standard_icon_library:
    path: ../../icons/standard
  mask:
    path: ../../lib/mask
  date:
    path: ../../lib/date
  interval:
    path: ../../lib/interval
  fee_payer_type:
    path: ../../types/fee_payer
  frequency_type:
    path: ../../types/frequency
  ordinal_suffix_string_from_int:
    path: ../../lib/ordinal_suffix_string_from_int

dev_dependencies:
  flutter_test:
    sdk: flutter
